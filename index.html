<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrousel 3D</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }
        .scene {
            margin: 80px auto;
            width: 210px;
            position: relative;
            aspect-ratio: 4 / 5;
            perspective: 1000px;
        }
        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;
        }
        .carousel>img{
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            aspect-ratio: 4 / 5;
            border-radius: 10px;
            transform: rotateY(var(--i)) translateZ(288px) ;
        }
        @keyframes rotate {
            0% {transform: rotateY(360deg);}
            100% {transform: rotateY(0deg);}
        }
        
     </style>
</head>
<body>
    <div class="scene">
        <div class="carousel">
            <img src="img/codmw4.jpg" style="--i:000deg">
            <img src="img/eafc27-capa.jpg" style="--i:040deg">
            <img src="img/milesmorales.jpg" style="--i:080deg">
            <img src="img/valorant-capa.jpg" style="--i:120deg">
            <img src="img/zelda.jpg" style="--i:160deg">
            <img src="img/gta6.jpg" style="--i:200deg">
            <img src="img/uncharted.jpg" style="--i:240deg">
            <img src="img/fallenorder.jpg" style="--i:280deg">
            <img src="img/astrobot.jpg" style="--i:320deg">
        </div>
    </div>
</body>
</html>
